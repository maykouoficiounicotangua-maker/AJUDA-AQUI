# Configuração do Supabase CLI para desenvolvimento local.
# Gerada à mão com as chaves essenciais; se a sua versão do CLI reclamar de algo, rode `supabase init`
# em outra pasta e compare. O importante: seed habilitado, e-mail SEM confirmação (para E2E), redirect do callback.
project_id = "ajuda-aqui"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Em dev/E2E o cadastro já entra logado. Em PRODUÇÃO mantenha true.
enable_confirmations = false
